version: "3.9"

# Riverside MVP — stack locale 100% open source
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: riverside
      POSTGRES_PASSWORD: changeme   # TODO: secrets store en production
      POSTGRES_DB: riverside
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverside"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
