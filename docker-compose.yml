# Riverside MVP — stack locale 100% open source
# EN: local 100% open-source stack. Les ports exposés sont définis dans
# docker-compose.override.yml (ports dédiés — les ports par défaut 5432/3000/
# 8000 sont occupés par d'autres projets sur la machine de dev).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: riverside
      POSTGRES_PASSWORD: changeme   # TODO: secrets store en production
      POSTGRES_DB: riverside
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverside"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
