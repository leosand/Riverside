# Config pytest — Riverside
# EN: pytest config. La suite par défaut est 100 % offline : les tests marqués
# `integration` (appels réseau réels STAC) sont exclus et se lancent
# explicitement via `pytest -m integration` (hors CI).

[pytest]
markers =
    integration: test d'intégration réseau réel (STAC Earth Search) — exclu par défaut / live network test, excluded by default
addopts = -m "not integration"
testpaths = tests
